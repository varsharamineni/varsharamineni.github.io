<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Varsha Ramineni — Projects</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 70px 24px;
    }

    header {
      margin-bottom: 50px;
    }

    h1 {
      font-size: 2.5rem;
      margin: 0 0 10px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #666;
      margin: 0;
    }

    .projects {
      display: grid;
      gap: 18px;
    }

    .project {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 24px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .project:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .project h2 {
      margin: 0 0 8px;
      font-size: 1.3rem;
    }

    .description {
      color: #666;
      margin: 0 0 18px;
    }

    .links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .links a {
      color: #0969da;
      text-decoration: none;
      font-weight: 500;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .loading,
    .error,
    .empty {
      color: #666;
      padding: 20px 0;
    }

    footer {
      margin-top: 60px;
      color: #888;
      font-size: 0.9rem;
    }

    footer a {
      color: inherit;
    }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <h1>Varsha Ramineni</h1>
      <p class="subtitle">Projects and research</p>
    </header>

    <section>
      <div id="projects" class="projects">
        <p class="loading">Loading projects...</p>
      </div>
    </section>

    <footer>
      <a href="https://github.com/varsharamineni" target="_blank">
        GitHub
      </a>
    </footer>

  </main>

  <script>
    const username = "varsharamineni";

    async function loadProjects() {
      const container = document.getElementById("projects");

      try {
        const response = await fetch(
          `https://api.github.com/users/${username}/repos?per_page=100&sort=updated`
        );

        if (!response.ok) {
          throw new Error("Unable to load GitHub repositories.");
        }

        const repos = await response.json();

        // Only show public repositories.
        // Forks are excluded so your portfolio focuses on your own projects.
        const projects = repos.filter(repo => !repo.fork);

        if (projects.length === 0) {
          container.innerHTML =
            '<p class="empty">No projects found.</p>';
          return;
        }

        container.innerHTML = projects.map(repo => {

          const description =
            repo.description ||
            "No description provided.";

          const projectPage =
            `https://${username}.github.io/${repo.name}/`;

          return `
            <article class="project">

              <h2>${escapeHtml(repo.name)}</h2>

              <p class="description">
                ${escapeHtml(description)}
              </p>

              <div class="links">

                <a
                  href="${projectPage}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Project page →
                </a>

                <a
                  href="${repo.html_url}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  GitHub →
                </a>

              </div>

            </article>
          `;
        }).join("");

      } catch (error) {

        container.innerHTML = `
          <p class="error">
            Unable to load projects right now.
            <a href="https://github.com/${username}">
              View them on GitHub →
            </a>
          </p>
        `;

        console.error(error);
      }
    }

    // Prevent repository descriptions from injecting HTML.
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    loadProjects();
  </script>

</body>
</html>
