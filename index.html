  <style>

    /* =========================================================
       TOKENS
    ========================================================= */

    :root {
      --paper: #ffffff;
      --ink: #000000;
      --ink-2: #4a4a4a;
      --ink-3: #888888;
      --rule: #d8d8d8;
      --rule-hair: #ececec;
      --tint: #f7f7f5;

      --sans:
        'Inter',
        -apple-system,
        BlinkMacSystemFont,
        'Helvetica Neue',
        Arial,
        sans-serif;

      --mono:
        'JetBrains Mono',
        ui-monospace,
        'SF Mono',
        monospace;

      --label-col: 88px;
      --gap: 32px;
      --content-col: 640px;

      --measure:
        calc(
          var(--label-col) +
          var(--gap) +
          var(--content-col)
        );
    }


    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);

      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;

      font-feature-settings: "kern" 1, "cv11" 1;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }


    /* =========================================================
       PAGE
    ========================================================= */

    .container {
      max-width: var(--measure);
      margin: 0 auto;
      padding: 0 40px;
    }


    /* =========================================================
       RUNNING HEADER
    ========================================================= */

    .runhead {
      padding: 24px 0 20px;

      border-bottom: 0.5px solid var(--rule);

      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.4;

      color: var(--ink-3);
      letter-spacing: 0.02em;

      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .runhead-left {
      color: var(--ink);
    }


    /* =========================================================
       MASTHEAD
    ========================================================= */

    .masthead {
      padding: 72px 0 64px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 24px;
    }

    .eyebrow-label {
      display: inline-block;

      padding: 4px 9px;

      border: 0.5px solid var(--ink);

      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow-text {
      font-size: 13px;
      color: var(--ink-2);
    }

    h1 {
      margin: 0 0 14px;

      font-size: 56px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 0;

      font-size: 20px;
      font-weight: 400;
      line-height: 1.4;

      color: var(--ink-2);
      letter-spacing: -0.01em;
    }


    /* =========================================================
       GITHUB LINK
    ========================================================= */

    .github-wrap {
      margin-top: 32px;
    }

    .github-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding: 10px 15px 10px 13px;

      border: 0.5px solid var(--ink);

      background: var(--paper);
      color: var(--ink);

      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;

      letter-spacing: 0.01em;

      text-decoration: none;

      transition:
        background 0.15s ease,
        color 0.15s ease;
    }

    .github-button:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .github-logo {
      width: 17px;
      height: 17px;

      fill: currentColor;

      flex-shrink: 0;
    }


    /* =========================================================
       PROJECT SECTION
    ========================================================= */

    .section-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      column-gap: var(--gap);

      padding: 22px 0;

      border-top: 0.5px solid var(--rule);
      border-bottom: 0.5px solid var(--rule);
    }

    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;

      color: var(--ink-3);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .section-title {
      font-size: 13px;
      font-weight: 500;
    }


    /* =========================================================
       PROJECT LIST
    ========================================================= */

    .projects {
      display: block;
    }

    .project {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      column-gap: var(--gap);

      padding: 30px 0;

      border-bottom: 0.5px solid var(--rule);
    }

    .project-index {
      font-family: var(--mono);
      font-size: 10px;

      color: var(--ink-3);
      padding-top: 5px;
    }

    .project-content {
      min-width: 0;
    }

    .project h2 {
      margin: 0 0 8px;

      font-size: 23px;
      font-weight: 500;
      line-height: 1.2;

      letter-spacing: -0.015em;
    }

    .description {
      max-width: 620px;

      margin: 0 0 18px;

      color: var(--ink-2);

      font-size: 14px;
      line-height: 1.65;
    }

    .project-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 14px;

      margin-bottom: 18px;

      font-family: var(--mono);
      font-size: 10px;

      color: var(--ink-3);
    }

    .project-meta .language {
      color: var(--ink-2);
    }

    .project-meta .separator {
      color: var(--rule);
    }


    /* =========================================================
       PROJECT LINKS
    ========================================================= */

    .project-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .project-link {
      display: inline-flex;
      align-items: center;

      padding: 7px 11px;

      border: 0.5px solid var(--ink);

      color: var(--ink);

      font-size: 11px;
      font-weight: 500;

      text-decoration: none;

      transition:
        background 0.15s ease,
        color 0.15s ease;
    }

    .project-link:hover {
      background: var(--ink);
      color: var(--paper);
    }


    /* =========================================================
       STATES
    ========================================================= */

    .loading,
    .empty,
    .error {
      padding: 30px 0;

      border-bottom: 0.5px solid var(--rule);

      color: var(--ink-3);

      font-size: 13px;
    }

    .error a {
      color: var(--ink);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      column-gap: var(--gap);

      padding: 40px 0 60px;

      color: var(--ink-3);

      font-family: var(--mono);
      font-size: 10px;
    }

    footer a {
      color: var(--ink);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      :root {
        --label-col: 54px;
        --gap: 20px;
      }

      .container {
        padding: 0 24px;
      }

      .runhead {
        padding-top: 18px;
      }

      .masthead {
        padding: 52px 0 48px;
      }

      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 18px;
      }

      .project h2 {
        font-size: 21px;
      }

      .description {
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {

      .container {
        padding: 0 20px;
      }

      .runhead {
        font-size: 9px;
      }

      .runhead-right {
        display: none;
      }

      .masthead {
        padding: 44px 0 40px;
      }

      h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 17px;
      }

      .project {
        grid-template-columns: minmax(0, 1fr);
      }
    }

  </style>

</head>

  </main>

  <script>

    const username = "varsharamineni";
    const portfolioRepo = "varsharamineni.github.io";


    async function loadProjects() {

      const container =
        document.getElementById("projects");


      try {

        const response = await fetch(
          `https://api.github.com/users/${username}/repos?per_page=100&sort=updated`
        );


        if (!response.ok) {
          throw new Error(
            "Unable to load GitHub repositories."
          );
        }


        const repos = await response.json();


        /*
         * Only display:
         *
         * 1. Non-fork repositories
         * 2. Repositories with GitHub Pages enabled
         * 3. Repositories other than this portfolio
         */

        const projects = repos.filter(repo =>
          !repo.fork &&
          repo.has_pages === true &&
          repo.name !== portfolioRepo
        );


        if (projects.length === 0) {

          container.innerHTML = `
            <p class="empty">
              No GitHub Pages projects found.
            </p>
          `;

          return;
        }


        const projectCards = await Promise.all(
          projects.map(async (repo) => {
            const readmeTitle = await getReadmeTitle(repo);

            const description =
              repo.description ||
              "No description provided.";


            const projectPage =
              `https://${username}.github.io/${repo.name}/`;


            const language =
              repo.language || "";


            return `

              <article class="project">
<div class="project-content">


                  <h2>
                    ${escapeHtml(readmeTitle || repo.name)}
                  </h2>


                  <p class="description">
                    ${escapeHtml(description)}
                  </p>


                  ${
                    language
                      ? `
                        <div class="project-meta">

                          <span class="language">
                            ${escapeHtml(language)}
                          </span>

                          <span class="separator">
                            /
                          </span>

                          <span>
                            Updated
                            ${formatDate(repo.updated_at)}
                          </span>

                        </div>
                      `
                      : ""
                  }


                  <div class="project-links">


                    <a
                      class="project-link"
                      href="${projectPage}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Project page →
                    </a>


                    <a
                      class="project-link"
                      href="${repo.html_url}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      GitHub →
                    </a>


                  </div>


                </div>


              </article>

            `;

          })
        );

        container.innerHTML = projectCards.join("");


      } catch (error) {

        console.error(error);


        container.innerHTML = `

          <p class="error">

            Unable to load projects right now.

            <a
              href="https://github.com/${username}"
              target="_blank"
              rel="noopener noreferrer"
            >
              View them on GitHub →
            </a>

          </p>

        `;

      }

    }


    async function getReadmeTitle(repo) {
      try {
        const response = await fetch(
          `https://api.github.com/repos/${username}/${repo.name}/readme`,
          {
            headers: {
              Accept: "application/vnd.github.raw+json"
            }
          }
        );

        if (!response.ok) return "";

        const markdown = await response.text();

        // Use the first Markdown H1 as the project title.
        const match = markdown.match(/^#\\s+(.+)$/m);

        return match ? match[1].trim().replace(/[*_`~]/g, "") : "";
      } catch (error) {
        console.warn(`Unable to read README for ${repo.name}.`, error);
        return "";
      }
    }


    function formatDate(dateString) {

      const date =
        new Date(dateString);


      return date.toLocaleDateString(
        "en-GB",
        {
          year: "numeric",
          month: "short",
          day: "numeric"
        }
      );

    }


    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    loadProjects();

  </script>
